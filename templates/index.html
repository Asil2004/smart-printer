<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEEE8">
<meta name="description" content="Smart Printchi — telefondan hujjat chop etish kioski: fayl yuklang, to‘lang, qog‘ozni oling.">
<title>Smart Printchi — Chop etish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=2.0.1">
</head>
<body>
<div class="app" id="app">

  <!-- ── Sarlavha ─────────────────────────────────────────── -->
  <header class="topbar">
    <button class="brand" id="brandBtn" type="button" aria-label="Smart Printchi — bosh sahifa">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C6F36B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
      </span>
      <span>
        <p class="brand-name">Printchi</p>
        <p class="status" id="printerStatus" role="status"><span class="dot"></span><span id="printerStatusText">Printer tekshirilmoqda…</span></p>
      </span>
    </button>
    <button class="link-btn" id="navBtn" type="button">Shablonlar →</button>
  </header>

  <!-- ── 1. Chop etish ────────────────────────────────────── -->
  <main class="view" id="viewPrint">
    <section class="chat" id="chat" aria-live="polite" aria-label="Yordamchi bilan suhbat"></section>

    <div class="chips" id="chips" hidden></div>

    <!-- Fayl hali tanlanmagan -->
    <section class="grid" id="startGrid">
      <button class="drop" id="dropZone" type="button">
        <span class="drop-icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </span>
        <span class="drop-title">Faylni tanlang</span>
        <span class="hint">PDF, Word (DOCX), JPG yoki PNG · 64 MB gacha</span>
      </button>
      <div id="quickTemplates" style="display: contents"></div>
    </section>

    <!-- Fayl tanlangach: sozlamalar -->
    <section class="grid" id="settingsGrid" hidden aria-label="Chop etish sozlamalari">
      <div class="tile span-2" id="printerTile">
        <p class="tile-label" id="lblPrinter">Printer tanlash</p>
        <div class="seg" role="group" aria-labelledby="lblPrinter">
          <button type="button" data-printer="laser_bw" id="btnPrinterLaser" aria-pressed="true">🖨️ Canon LBP3010 (A4 Lazer)</button>
          <button type="button" data-printer="thermal" id="btnPrinterThermal" aria-pressed="false">🧾 XP-58 (58mm Chek)</button>
        </div>
      </div>
      <div class="tile">
        <p class="tile-label" id="lblCopies">Nusxa</p>
        <div class="stepper" role="group" aria-labelledby="lblCopies">
          <button class="round" id="copiesDec" type="button" aria-label="Nusxani kamaytirish">−</button>
          <output id="copiesOut" aria-live="polite">1</output>
          <button class="round dark" id="copiesInc" type="button" aria-label="Nusxani ko‘paytirish">+</button>
        </div>
      </div>
      <div class="tile">
        <p class="tile-label" id="lblOrient">Yo‘nalish</p>
        <div class="seg" role="group" aria-labelledby="lblOrient">
          <button type="button" data-orient="portrait" aria-pressed="true">Kitob</button>
          <button type="button" data-orient="landscape" aria-pressed="false">Albom</button>
        </div>
      </div>
      <div class="tile">
        <p class="tile-label" id="lblPages">Sahifalar</p>
        <div class="seg" role="group" aria-labelledby="lblPages">
          <button type="button" data-range="all" aria-pressed="true">Hammasi</button>
          <button type="button" data-range="custom" aria-pressed="false">Tanlash</button>
        </div>
      </div>
      <div class="tile">
        <p class="tile-label" id="lblColor">Rang</p>
        <div class="seg" role="group" aria-labelledby="lblColor">
          <button type="button" data-color="gray" aria-pressed="true">Oq-qora</button>
          <button type="button" data-color="color" aria-pressed="false" id="colorBtn" disabled title="Rangli printer ulanmagan">Rangli</button>
        </div>
      </div>
      <div class="tile span-2" id="rangeTile" hidden>
        <label class="tile-label" for="rangeInput">Qaysi betlar? (masalan: 1–3, 5, 8–10)</label>
        <input class="field" id="rangeInput" inputmode="numeric" autocomplete="off" placeholder="1-3, 5">
        <p class="hint" id="rangeHint"></p>
      </div>
    </section>

    <div class="spacer"></div>

    <section class="paybar" aria-label="To‘lov">
      <div>
        <p class="paybar-label" id="totalLabel">Fayl tanlanmagan</p>
        <p class="paybar-total" id="totalText">0 so‘m</p>
      </div>
      <button class="btn-accent" id="payBtn" type="button" disabled>To‘lash</button>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <button class="round" id="attachBtn" type="button" aria-label="Fayl biriktirish">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5 5 0 0 1-7-7L14 5.5a3.5 3.5 0 0 1 5 5L10.5 19"/></svg>
      </button>
      <label class="sr-only" for="msgInput">Buyurtmani yozing</label>
      <input id="msgInput" placeholder="Masalan: 2 nusxa, 5–8 bet, albom" enterkeyhint="send">
      <button class="round dark" type="submit" aria-label="Yuborish">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <input type="file" id="fileInput" accept=".pdf,.docx,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  </main>

  <!-- ── 2. Shablonlar ────────────────────────────────────── -->
  <main class="view" id="viewTemplates" hidden>
    <h1 class="view-title">Tayyor shablonlar</h1>
    <label class="sr-only" for="tplSearch">Shablon qidirish</label>
    <input class="field" id="tplSearch" placeholder="Qidirish: ariza, mustaqil ish…" style="background: #FFFFFF">
    <section class="grid" id="tplGrid" aria-live="polite"></section>
  </main>
</div>

<!-- ── To'lov oynasi ──────────────────────────────────────── -->
<div class="overlay" id="payOverlay" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="payTitle" id="paySheet">
    <span class="grabber" aria-hidden="true"></span>
    <div class="sheet-head">
      <h2 class="sheet-title" id="payTitle">To‘lov</h2>
      <p class="order-code" id="orderCode">#······</p>
    </div>
    <div class="amount-tile">
      <p class="paybar-label" id="paySummary">Buyurtma tayyorlanmoqda…</p>
      <p class="amount-big" id="payAmount">— so‘m</p>
    </div>
    <div class="methods" role="group" aria-label="To‘lov usuli">
      <button type="button" data-method="qr" aria-pressed="true">QR</button>
      <button type="button" data-method="click" aria-pressed="false">Click</button>
      <button type="button" data-method="payme" aria-pressed="false">Payme</button>
      <button type="button" data-method="card" aria-pressed="false">Karta</button>
    </div>
    <div class="pay-panel" id="payPanel"></div>
    <p class="pay-status" id="payStatus" role="status">Buyurtma yaratilmoqda…</p>
    <div class="row2">
      <button class="btn-ghost" id="payCancel" type="button">Bekor qilish</button>
      <button class="btn-dark" id="payClaim" type="button" disabled>To‘lov qildim</button>
    </div>
  </section>
</div>

<!-- ── Natija ─────────────────────────────────────────────── -->
<div class="overlay" id="resultOverlay" hidden>
  <section class="sheet result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <span class="result-icon" id="resultIcon" aria-hidden="true"></span>
    <h2 id="resultTitle">Hujjat tayyor!</h2>
    <p id="resultText"></p>
    <button class="btn-dark" id="resultBtn" type="button">Yangi buyurtma</button>
  </section>
</div>

<!-- ── Admin ──────────────────────────────────────────────── -->
<div class="overlay" id="adminOverlay" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
    <span class="grabber" aria-hidden="true"></span>
    <div class="sheet-head">
      <h2 class="sheet-title" id="adminTitle">Admin: shablonlar</h2>
      <button class="link-btn" id="adminClose" type="button">Yopish</button>
    </div>
    <form class="form tile" id="adminTokenForm">
      <label>Admin paroli (ADMIN_TOKEN)<input class="field" id="adminToken" type="password" autocomplete="current-password"></label>
      <button class="btn-dark" type="submit">Saqlash</button>
    </form>
    <form class="form tile" id="adminUpload">
      <label>Nomi<input class="field" name="name" required placeholder="Masalan: Kurs ishi yuzi"></label>
      <label>Tavsif<input class="field" name="description" placeholder="Qisqa izoh"></label>
      <label>Bir bet narxi (so‘m)<input class="field" name="price_per_page" type="number" min="0" step="100" value="500"></label>
      <label>Fayl (PDF yoki DOCX)<input class="field" name="file" type="file" accept=".pdf,.docx" required style="padding-top: 10px"></label>
      <button class="btn-dark" type="submit">Shablonni yuklash</button>
    </form>
    <div class="admin-list" id="adminList"></div>
  </section>
</div>

<div class="toast" id="toast" role="alert" hidden></div>

<script src="config.js?v=2.0.1"></script>
<script src="app.js?v=2.0.1"></script>
</body>
</html>
